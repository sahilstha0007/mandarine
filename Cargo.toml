[package]
name = "mandarine"
version = "0.1.0"
edition = "2024"
description = "Tangerine-style drag-and-drop file converter for Hyprland/Wayland"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
notify-rust = "4"
mime_guess = "2"
tokio = { version = "1", features = ["rt", "macros", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4-layer-shell = "0.8"

[profile.release]
lto = "thin"
strip = true
