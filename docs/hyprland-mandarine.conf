# =============================================================================
# Hyprland window rules for Mandarine (Tangerine-style file converter)
# Add these to ~/.config/hypr/conf/custom.conf (ML4W keeps stock custom.lua
# immutable; window rules go in hypr.conf directly).
# =============================================================================

# The wheel is a layer-shell OVERLAY surface now, not a toplevel, so float /
# decorate / ontop / noinitialfocus rules no longer apply to it. They are kept
# only for the fallback path on compositors without wlr-layer-shell, where the
# dial is still a borderless toplevel parked by hyprctl.
#
# What the wheel *does* need is a layer rule on its namespace, so Hyprland
# blurs the desktop behind the glass. Lua config:
#
#   hl.layer_rule({
#       name = "mandarine-glass",
#       match = { namespace = "mandarine" },
#       blur = true,
#       ignore_alpha = 0.25,
#   })
windowrulev2 = float, class:^(io.sahil.mandarine)$
windowrulev2 = decorate = false, class:^(io.sahil.mandarine)$
windowrulev2 = noinitialfocus, class:^(io.sahil.mandarine)$
windowrulev2 = round = 0, class:^(io.sahil.mandarine)$

# ML4W note: if you run the ML4W Hyprland Lua config, you can still add the
# keybind in ~/.config/ml4w/hypr/custom.lua:
#   hl.bind("SUPER + Y", hl.dsp.exec_cmd("mandarine"))

# Optional: blur behind the wheel for a frosted-glass effect
# windowrulev2 = blur = true, class:^(io.sahil.mandarine)$

# Reload Hyprland after saving: hyprctl reload
# =============================================================================
# Resident edge strip (mandarine listen)
# =============================================================================
# Wayland exposes no global "drag started" event, so watching for a drag means
# already owning a surface the drag can be offered to. `mandarine listen` keeps
# a 6 px layer-shell strip on one screen edge; a drag that touches it opens the
# wheel under the cursor, and leaving without dropping fades it back out.
#
# Start it once per session (pick the edge your bar/dock leaves free):
#
#   exec-once = mandarine listen --edge top
#
# The strip is an OVERLAY layer surface with exclusive_zone 0: it reserves no
# space, but it does take pointer input across its 6 px. Both the strip and the
# revealed wheel are layer surfaces; the wheel matches the `mandarine` namespace
# layer rule above, not the window rules.
